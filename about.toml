# License selection for the locked Apple Silicon production/build graph.
# MIT is preferred for dual-licensed crates. AND clauses remain mandatory.
accepted = [
  "AGPL-3.0-only", "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "MPL-2.0", "Zlib", "Unlicense", "0BSD",
  "CC0-1.0", "MIT-0", "BSL-1.0", "Apache-2.0 WITH LLVM-exception",
]
targets = ["aarch64-apple-darwin"]
ignore-dev-dependencies = true
