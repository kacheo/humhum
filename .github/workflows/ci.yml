name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install CMake
        run: brew install cmake
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
