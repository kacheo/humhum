name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing reviewed version tag to build and publish as an installer"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    permissions:
      contents: write
    steps:
      - name: Validate requested release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: brew install cmake
      - run: npm ci
      - run: node scripts/check-notices.mjs
      - name: Check release version
        run: |
          node scripts/check-release-version.mjs
      - run: npm test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/requirements-test.txt
      # The tagged test suite may contain older fixtures that inherit RELEASE_TAG.
      # Keep the real release tag for version/build/publication, not fixture tests.
      - run: env -u RELEASE_TAG npm run test:release
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: rustup target add aarch64-apple-darwin
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          umask 077
          keychain_path="$RUNNER_TEMP/humhum-release.keychain-db"
          certificate_path="$RUNNER_TEMP/humhum-release.p12"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$certificate_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
      - name: Build, sign, notarize and verify
        id: build
        env:
          CI: "true"
          NO_OPEN: "1"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/build-release.sh aarch64-apple-darwin
      - name: Publish installer and exact source tag
        env:
          GH_TOKEN: ${{ github.token }}
          HUMHUM_DMG: ${{ steps.build.outputs.dmg }}
        run: node scripts/publish-release.mjs
